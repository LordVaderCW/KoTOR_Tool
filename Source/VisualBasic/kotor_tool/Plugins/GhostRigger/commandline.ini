; -----------------------------------------------------------------
; GhostRigger / KotOR 3D Model Converter Plugin Command File
; KoTOR Tool Restoration Project
; -----------------------------------------------------------------

[Plugin]
Id=ghostrigger
Name=GhostRigger / KotOR 3D Model Converter
Type=ExternalTool
Enabled=True

[LaunchUI]
Executable=GhostRigger-K1-K2.exe
Arguments=
WorkingDirectory={plugin_dir}
OutputMode=None
CaptureStdOut=False
CaptureStdErr=False
TimeoutSeconds=0
WaitForExit=False
ShowWindow=True

[InspectMDL]
Executable=py.exe
Arguments=-3.12 -m tools.model_inspector --mdl "{input}" --mdx "{sidecar_mdx}" --json -o "{output}"
WorkingDirectory={plugin_dir}
OutputMode=File
OutputExtension=json
CaptureStdOut=True
CaptureStdErr=True
TimeoutSeconds=60

; Reserved for future dev-supported conversion CLI.
[ExportMDLToFBX]
Executable=GhostRiggerCLI.exe
Arguments=export-mdl --game {game_name} --mdl "{input}" --mdx "{sidecar_mdx}" --format fbx --output "{output}" --copy-textures --texture-output "{texture_output}" --no-gui
WorkingDirectory={plugin_dir}
OutputMode=File
OutputExtension=fbx
CaptureStdOut=True
CaptureStdErr=True
TimeoutSeconds=180

[ImportFBXToMDL]
Executable=GhostRiggerCLI.exe
Arguments=import-fbx --game {game_name} --input "{input}" --output-mdl "{output_mdl}" --output-mdx "{output_mdx}" --texture-dir "{texture_dir}" --overwrite --no-gui
WorkingDirectory={plugin_dir}
OutputMode=Files
CaptureStdOut=True
CaptureStdErr=True
TimeoutSeconds=180
