; -----------------------------------------------------------------
; KoTOR Tool Plugin Command File
; Plugin: DeNCS
; Purpose: Decompile .ncs scripts to .nss source
; -----------------------------------------------------------------

[Command]
Executable=NCSDecompCLI.exe
Arguments=-i "{input}" -o "{output}" --nwscript "{nwscript}" --overwrite
WorkingDirectory={plugin_dir}
OutputMode=File
OutputExtension=.nss
CaptureStdOut=True
CaptureStdErr=True
TimeoutMS=15000
ShowWindow=False
OverwriteOutput=True
SuccessExitCode=0
TreatStdErrAsFailure=False